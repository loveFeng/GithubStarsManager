services:
  app:
    image: github-stars-manager-fullstack:local
    build:
      context: .
      dockerfile: Dockerfile.fullstack
    ports:
      - "8080:3000"
    environment:
      API_SECRET: ${API_SECRET:?Set API_SECRET in .env before starting}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  backend-data:
