name: Desktop Test

on:
  push:
  pull_request:

jobs:
  desktop-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Xvfb (for headless Electron)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run desktop smoke test
        env:
          TEST_TIMEOUT_MS: '30000'
        run: xvfb-run -a npm run test:desktop

